<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Jambe Pizza</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <!-- TOPO AVISO -->
    <div class="topo-aviso">🔥 Forno a Lenha | Entrega Rápida em Parnaíba 🍕</div>

    <!-- CABEÇALHO -->
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <a href="index.html" class="logo-link" style="text-decoration: none; display: flex; align-items: center;">
                <img src="img/jambepizza.png" alt="Jambe Pizza" class="logo-img-header" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display: none; color: var(--cor-destaque); font-size: 1.5rem; font-weight: bold;">Jambe Pizza 🍕</span>
            </a>
            <nav>
                <a href="index.html">Início</a>
                <a href="cardapio.html" aria-current="page">Cardápio</a>
                <a href="carrinho.html">Carrinho <span data-contador>0</span></a>
            </nav>
        </div>
    </header>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="page-content">
        <div class="container">
            <div class="titulo-secao">
                <h2>Nosso Cardápio</h2>
            </div>
            
            <!-- O catálogo de pizzas e bebidas é injetado dinamicamente aqui -->
            <div id="catalogo" class="grade-produtos"></div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <div class="container rodape-conteudo">
            <div>
                <strong>Jambe Pizza</strong>
                <p>O verdadeiro sabor da pizza na lenha.</p>
            </div>
            <div>
                <p>&copy; 2026 Jambe Pizza. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/configuracao.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cardapio.js"></script>
</body>
</html>
